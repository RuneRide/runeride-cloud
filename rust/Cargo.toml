[workspace]
resolver = "3"
members = ["render", "core", "server"]
# cloud-service a son propre espace de travail (kit AWS)
exclude = ["cloud-service"]
# render/ (moteur GPU) demande le kit CUDA (nvcc) : compilé seulement à la demande, voir packaging/install.sh
default-members = ["core", "server"]

[workspace.package]
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/runeride/runeride-cloud"

[profile.release]
debug = false
